openapi: 3.0.3
info:
  title: ApproveDesk API
  version: 1.0.0
  description: Personal Sanctum tokens. Send Authorization Bearer. Optional Idempotency-Key on POST.
servers:
  - url: /api/v1
paths:
  /user:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current token owner }
  /request-types:
    get:
      security: [{ bearerAuth: [] }]
      description: Published request-type schemas. Scope request-types:read or submissions:read.
      responses:
        "200": { description: Schema list }
  /request-types/{slug}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: One schema }
  /submissions:
    get:
      security: [{ bearerAuth: [] }]
      description: List and detail both require submissions:read and remain subject to model-level visibility.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
      responses:
        "200": { description: Page or cursor page of submissions }
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 255 }
      responses:
        "201": { description: Created }
        "409": { description: "Idempotency-Key reused with a different body, or the first request with this key is still running (Retry-After is set)" }
  /submissions/{id}:
    get:
      security: [{ bearerAuth: [] }]
      description: One accessible submission. Requires submissions:read and remains subject to model-level visibility.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: One submission }
  /submissions/{id}/submit:
    post:
      security: [{ bearerAuth: [] }]
      description: "Submit an owned draft, returned or awaiting-information submission. Requires submissions:write. A comment is required when answering an information request."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 255 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 5000 }
      responses:
        "200": { description: The submitted submission }
        "422": { description: "Not eligible, a required answer or field is missing, or nobody can approve (errors.submit)" }
  /submissions/{id}/actions:
    post:
      security: [{ bearerAuth: [] }]
      description: Record an approver decision through the workflow engine. Requires approvals:act.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject, return, request_information, escalate, comment] }
                comment: { type: string, description: "Required for reject, return, request_information and escalate" }
                step_id: { type: integer, description: "workflow.current_step.id as read before deciding; refused with 422 if the request has moved on" }
      responses:
        "200": { description: The updated submission }
        "422": { description: Refused by the workflow engine }
  /openapi.json:
    get:
      responses:
        "200": { description: This document }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
