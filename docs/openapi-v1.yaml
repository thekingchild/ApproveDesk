openapi: 3.0.3
info:
  title: ApproveDesk API
  version: 1.0.0
  description: Personal Sanctum tokens. Send Authorization Bearer. Optional Idempotency-Key on POST.
servers:
  - url: /api/v1
paths:
  /user:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current token owner }
  /request-types:
    get:
      security: [{ bearerAuth: [] }]
      description: Published request-type schemas. Scope request-types:read or submissions:read.
      responses:
        "200": { description: Schema list }
  /request-types/{slug}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: One schema }
  /submissions:
    get:
      security: [{ bearerAuth: [] }]
      description: List and detail both require submissions:read and remain subject to model-level visibility.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200": { description: Page or cursor page of submissions }
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      responses:
        "201": { description: Created }
  /submissions/{id}:
    get:
      security: [{ bearerAuth: [] }]
      description: One accessible submission. Requires submissions:read and remains subject to model-level visibility.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: One submission }
  /openapi.json:
    get:
      responses:
        "200": { description: This document }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
